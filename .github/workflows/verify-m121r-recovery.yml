name: verify-m121r-recovery

on:
  push:
    branches:
      - automation/verify-m121r-tasks5-8-recovery

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: feature/m1.2.1r-tasks5-8-recovery
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Task 8 focused tests
        working-directory: frontend
        run: npm test -- --run src/spatial/AccessibleInstrumentControls.test.tsx src/App.test.tsx src/App.renderer.test.tsx
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
