name: verify-m121r-recovery

on:
  push:
    branches:
      - automation/verify-m121r-tasks5-8-recovery

jobs:
  verify-task9-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical M1.2.1R branch
        uses: actions/checkout@v4
        with:
          ref: feature/m1.2.1r-historical-computation-rescue
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Task 9 frontend gate
        working-directory: frontend
        run: npm test -- --run src/instrument/model.test.ts src/instrument/reading.test.ts src/App.reliquary.test.tsx src/App.renderer.test.tsx

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Task 9 bridge and kernel gate
        run: python -m pytest tests/test_arca_mechanica_bridge.py tests/test_arca_historica_kernel.py -q
