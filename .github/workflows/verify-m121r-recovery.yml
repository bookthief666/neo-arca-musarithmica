name: verify-m121r-recovery

on:
  push:
    branches:
      - automation/verify-m121r-tasks5-8-recovery

jobs:
  final-fold-fix-gate:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: feature/m1.2.1r-historical-computation-rescue
          fetch-depth: 0

      - name: Verify Fold-fix head
        run: test "$(git rev-parse HEAD)" = "63e8472084fdfa544dfb1f15c2f297a2f67a2a4c"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Full frontend suite
        working-directory: frontend
        run: npm test -- --run

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Diff hygiene and authority scans
        shell: bash
        run: |
          set -euo pipefail
          BASE=7f9263d52845cdd8fb67ba34857cdd9a38fef2fa
          git diff --check "$BASE"..HEAD
          if git grep -n -F 'document.body.dataset.arcaGrab' -- frontend/src; then exit 1; fi
          if git grep -n -E 'MAX_VERTICAL_OFFSET|VIRGA_TRAVEL' -- frontend/src/spatial; then exit 1; fi
          if ! git diff --quiet "$BASE"..HEAD -- scripts/arca_historica_kernel.py historical_data data/syntagma1_pinax04 data/mensa_tonographica; then exit 1; fi
