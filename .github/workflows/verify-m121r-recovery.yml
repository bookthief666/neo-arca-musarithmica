name: verify-m121r-recovery

on:
  push:
    branches:
      - automation/verify-m121r-tasks5-8-recovery

jobs:
  final-exact-head:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical M1.2.1R branch
        uses: actions/checkout@v4
        with:
          ref: feature/m1.2.1r-historical-computation-rescue
          fetch-depth: 0

      - name: Record exact head
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "bd0dc1d7fc2ebfd1c5bece78da848caf16bc5d9a"

      - name: Prepare evidence
        run: mkdir -p /tmp/m121r-final

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Full frontend suite
        working-directory: frontend
        run: npm test -- --run | tee /tmp/m121r-final/frontend-suite.txt

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck | tee /tmp/m121r-final/typecheck.txt

      - name: Lint
        working-directory: frontend
        run: npm run lint | tee /tmp/m121r-final/lint.txt

      - name: Production build with manifest
        working-directory: frontend
        run: |
          npm run typecheck
          npx vite build --manifest | tee /tmp/m121r-final/build.txt

      - name: Dependency graph and current bundle
        working-directory: frontend
        run: |
          npm ls three @react-three/fiber --all | tee /tmp/m121r-final/npm-ls-three-r3f.txt
          node --input-type=module <<'NODE' > /tmp/m121r-final/current-bundle.json
          import fs from 'node:fs'
          import zlib from 'node:zlib'
          const manifest=JSON.parse(fs.readFileSync('dist/.vite/manifest.json','utf8'))
          const entry=Object.entries(manifest).find(([key,value])=>key.includes('SpatialArca')||value.src?.includes('SpatialArca'))
          if(!entry) throw new Error('SpatialArca entry missing')
          const [manifestKey,value]=entry
          const bytes=fs.readFileSync('dist/'+value.file)
          process.stdout.write(JSON.stringify({
            commit:'bd0dc1d7fc2ebfd1c5bece78da848caf16bc5d9a',
            manifestKey,file:value.file,rawBytes:bytes.length,
            gzipBytes:zlib.gzipSync(bytes,{level:9}).length,
            brotliBytes:zlib.brotliCompressSync(bytes).length
          },null,2))
          NODE

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Full Python suite
        run: python -m pytest -q | tee /tmp/m121r-final/python-suite.txt

      - name: Final authority and diff gates
        shell: bash
        run: |
          set -euo pipefail
          BASE=7f9263d52845cdd8fb67ba34857cdd9a38fef2fa
          git diff --check "$BASE"..HEAD
          if git grep -n -E 'RodTemplate|ColumnRodInstance|state\.rods|heldRodId|DEPLOY_ROD|RETRIEVE_ROD|PLACE_HELD_ROD|MOVE_ROD|align_rods|deploy_rods|place_held_rod|engage_tone_ii|historical_alignment_ready|tonal_resolution|read_transverse|rod_templates|rod_instances|toneEngaged|alignmentReady|isAlignmentReady|onDeployRod|onMoveRod|onEngageTone|toneAvailable' -- frontend/src; then
            echo 'Removed contract returned' >&2; exit 1
          fi
          if git grep -n -F 'document.body.dataset.arcaGrab' -- frontend/src; then
            echo 'Global grab marker returned' >&2; exit 1
          fi
          if git grep -n -E 'MAX_VERTICAL_OFFSET|VIRGA_TRAVEL' -- frontend/src/spatial; then
            echo 'Legacy band-control geometry returned' >&2; exit 1
          fi
          if ! git diff --quiet "$BASE"..HEAD -- scripts/arca_historica_kernel.py historical_data data/syntagma1_pinax04 data/mensa_tonographica; then
            echo 'Immutable historical authority changed' >&2; exit 1
          fi
          {
            echo 'head: bd0dc1d7fc2ebfd1c5bece78da848caf16bc5d9a'
            echo 'diff-check: pass'
            echo 'removed-contract-scan: pass'
            echo 'global-grab-marker-scan: pass'
            echo 'legacy-band-control-scan: pass'
            echo 'M0.9-and-historical-data: unchanged'
          } | tee /tmp/m121r-final/authority-scans.txt

      - name: Upload final exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-2-1r-final-exact-head-evidence
          path: /tmp/m121r-final
          if-no-files-found: error
