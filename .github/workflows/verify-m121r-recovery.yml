name: verify-m121r-recovery

on:
  push:
    branches:
      - automation/verify-m121r-tasks5-8-recovery

jobs:
  fold-reader-rescue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: feature/m1.2.1r-historical-computation-rescue
          fetch-depth: 0

      - name: Verify expected Fold rescue head
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "63e8472084fdfa544dfb1f15c2f297a2f67a2a4c"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Focused reader tests
        working-directory: frontend
        run: npm test -- --run src/spatial/scene/ReadingLens.test.ts src/spatial/readerInteraction.test.tsx src/spatial/interaction.test.ts src/App.renderer.test.tsx

      - name: Typecheck and lint
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint

      - name: Setup Python bridge
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/foldqa
          cd /tmp/foldqa
          npm init -y >/dev/null
          npm install playwright >/dev/null
          npx playwright install --with-deps chromium

      - name: Start local app
        working-directory: frontend
        run: |
          npx vite --host 127.0.0.1 --port 4173 >/tmp/vite.log 2>&1 &
          echo $! >/tmp/vite.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1

      - name: Verify card-surface drag reaches Event 6
        run: |
          cat >/tmp/foldqa/reader.mjs <<'NODE'
          import { chromium } from 'playwright'
          const browser=await chromium.launch({
            headless:true,
            args:['--use-angle=swiftshader','--use-gl=angle','--enable-webgl','--ignore-gpu-blocklist'],
          })
          const page=await browser.newPage({viewport:{width:884,height:1104},deviceScaleFactor:1})
          await page.goto('http://127.0.0.1:4173/?renderer=spatial',{waitUntil:'networkidle'})

          const toggle=page.getByRole('button',{name:'Instrument controls'})
          await toggle.click()
          await page.getByRole('button',{name:'Open the Arca'}).click()
          await page.getByRole('button',{name:/Bank I, DODECAMORIVM/i}).click()
          await page.getByRole('button',{name:/Open Cell IV/i}).click()
          await page.getByRole('button',{name:/Lift.*critical-edition carrier/i}).click()
          await page.getByRole('button',{name:/Seat the carrier at the event-reading station/i}).click()
          await page.waitForTimeout(1800)
          await toggle.click()
          await page.waitForFunction(()=>Boolean(window.__arcaProbe),null,{timeout:15000})

          const points=await page.evaluate(()=>({
            card:window.__arcaProbe.project(0,0.082,0.159),
            event6:window.__arcaProbe.project(0,0.088,0.1938),
            camera:window.__arcaProbe.camera(),
          }))

          await page.mouse.move(points.card.x,points.card.y)
          await page.mouse.down()
          await page.mouse.move(points.event6.x,points.event6.y,{steps:16})
          await page.waitForTimeout(180)
          await page.mouse.up()

          await toggle.click()
          const status=await page.getByRole('status').textContent()
          if(!status?.includes('Event 6 of 6')) {
            throw new Error('Dragging the event folio surface did not reach Event 6: '+status)
          }
          await browser.close()
          NODE
          node /tmp/foldqa/reader.mjs

      - name: Stop app
        if: always()
        run: if [ -f /tmp/vite.pid ]; then kill $(cat /tmp/vite.pid) || true; fi
