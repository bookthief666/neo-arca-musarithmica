name: verify-m121r-recovery

on:
  push:
    branches:
      - automation/verify-m121r-tasks5-8-recovery

jobs:
  diagnose-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m1.2.1r-historical-computation-rescue
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright
        run: |
          mkdir -p /tmp/browserqa
          cd /tmp/browserqa
          npm init -y >/dev/null
          npm install playwright >/dev/null
          npx playwright install --with-deps chromium
      - name: Start Vite
        working-directory: frontend
        run: |
          npx vite --host 127.0.0.1 --port 4173 >/tmp/vite-reader.log 2>&1 &
          echo $! >/tmp/vite-reader.pid
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/vite-reader.log; exit 1
      - name: Write diagnostic
        run: |
          cat >/tmp/browserqa/reader.mjs <<'NODE'
          import {chromium} from 'playwright'
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--use-gl=angle','--enable-webgl','--ignore-gpu-blocklist']})
          const context=await browser.newContext({viewport:{width:1104,height:884},deviceScaleFactor:1})
          const page=await context.newPage()
          page.on('pageerror',e=>console.log('PAGEERROR',String(e)))
          page.on('console',m=>{if(m.type()==='error')console.log('CONSOLE_ERROR',m.text())})
          await page.goto('http://127.0.0.1:4173/?renderer=spatial',{waitUntil:'networkidle'})
          const open=async()=>{
            await page.getByRole('button',{name:'Instrument controls'}).click()
            await page.getByRole('button',{name:'Open the Arca'}).click()
            await page.getByRole('button',{name:/Bank I, DODECAMORIVM/i}).click()
            await page.getByRole('button',{name:/Open Cell IV/i}).click()
            await page.getByRole('button',{name:/Lift.*critical-edition carrier/i}).click()
            await page.getByRole('button',{name:/Seat the carrier at the event-reading station/i}).click()
            await page.getByRole('button',{name:'Event 1 of 6'}).click()
            await page.getByRole('button',{name:'Instrument controls'}).click()
          }
          await open()
          await new Promise(r=>setTimeout(r,2000))
          await page.waitForFunction(()=>Boolean(window.__arcaProbe),null,{timeout:15000})
          const info=await page.evaluate(()=>{
            const ys=[0.047,0.053]
            const zs=[0.1362,0.14772,0.15924,0.17076,0.18228,0.1938]
            return {
              camera:window.__arcaProbe.camera(),
              points:ys.map(y=>zs.map(z=>window.__arcaProbe.project(0,y,z))),
              cost:window.__arcaProbe.cost(),
              canvas:document.querySelector('canvas')?.getBoundingClientRect().toJSON?.(),
              stage:document.querySelector('.spatial-stage')?.getBoundingClientRect().toJSON?.(),
              status:document.querySelector('[role="status"]')?.textContent,
            }
          })
          console.log('INFO',JSON.stringify(info,null,2))
          await page.screenshot({path:'/tmp/reader-before.png',fullPage:true})
          const points=info.points[1]
          await page.mouse.move(points[0].x,points[0].y)
          await page.mouse.down()
          console.log('DOWN_AT',JSON.stringify(points[0]))
          for(let i=0;i<points.length;i++){
            await page.mouse.move(points[i].x,points[i].y,{steps:5})
            await new Promise(r=>setTimeout(r,120))
            console.log('MOVE',i+1,JSON.stringify(points[i]),JSON.stringify(await page.evaluate(()=>({
              status:document.querySelector('[role="status"]')?.textContent,
              camera:window.__arcaProbe.camera()
            }))))
          }
          await page.mouse.up()
          console.log('AFTER_UP',JSON.stringify(await page.evaluate(()=>({
            status:document.querySelector('[role="status"]')?.textContent,
            camera:window.__arcaProbe.camera()
          }))))
          await page.screenshot({path:'/tmp/reader-after.png',fullPage:true})
          await context.close(); await browser.close()
          NODE
      - name: Diagnose reader
        run: node /tmp/browserqa/reader.mjs
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-diagnostic
          path: |
            /tmp/reader-before.png
            /tmp/reader-after.png
            /tmp/vite-reader.log
